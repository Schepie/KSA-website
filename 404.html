<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KSA Zonhoven | Doorsturen...</title>
  <meta http-equiv="refresh" content="0; url=/">
  <script>
    // GitHub Pages 404 Intelligent Router & Redirect
    (function() {
      try {
        const path = window.location.pathname;
        const search = window.location.search || '';
        const hash = window.location.hash || '';

        // 1. Verwijder de oude repository-submap '/KSA-website' of '/ksa-website' uit het pad
        let cleanPath = path.replace(/^\/KSA-website(\/|$)/i, '/');

        // 2. Als het pad naar index.html of leeg leidt, stuur door naar de hoofdpagina '/'
        if (cleanPath === '' || cleanPath === '/index.html' || cleanPath === '/') {
          const isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
          const isSmallScreen = window.innerWidth <= 768;
          
          // Smartphone bezoekers direct naar mobiele versie, desktop naar '/'
          if (isMobileUA || isSmallScreen) {
            window.location.replace('/mobile.html' + hash);
          } else {
            window.location.replace('/' + hash);
          }
          return;
        }

        // 3. Als iemand direct naar mobile.html zocht onder /KSA-website/
        if (cleanPath.endsWith('/mobile.html')) {
          window.location.replace('/mobile.html' + search + hash);
          return;
        }

        // 4. Voor alle andere niet-bestaande URL's: val terug op de hoofdpagina
        window.location.replace('/' + search + hash);
      } catch (e) {
        window.location.replace('/');
      }
    })();
  </script>
</head>
<body style="font-family:system-ui, -apple-system, sans-serif; text-align:center; padding:60px 20px; background:#0067b1; color:#fff; margin:0;">
  <div style="max-width:400px; margin:0 auto; background:rgba(255,255,255,0.1); padding:30px 20px; border-radius:16px;">
    <h2 style="margin:0 0 10px 0;">KSA Zonhoven</h2>
    <p style="margin:0 0 16px 0; opacity:0.9;">Je wordt automatisch doorgestuurd naar de officiële website...</p>
    <a href="/" style="display:inline-block; color:#002b7f; background:#ffe600; padding:10px 20px; border-radius:999px; font-weight:bold; text-decoration:none;">
      Klik hier als je niet direct wordt doorgestuurd &rarr;
    </a>
  </div>
</body>
</html>
